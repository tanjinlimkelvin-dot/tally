<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="s2-title s2-desc">
  <title id="s2-title">Step 2: Correctly Select Variables (Right vs Wrong)</title>
  <desc id="s2-desc">Comparison showing why typing text fails and how to tap the variable pill in iOS Shortcuts.</desc>
  <rect width="900" height="490" fill="#f4f1eb" rx="16"/>
  <rect x="2" y="2" width="896" height="486" fill="none" stroke="#e0dbd1" stroke-width="2" rx="14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif">
    <!-- Header -->
    <text x="36" y="46" font-size="22" font-weight="700" fill="#1d1c19">Step 2: Crucial Tip — Insert Variable Pills, Don't Type Text!</text>
    <text x="36" y="74" font-size="14" fill="#68645e">The #1 Beginner Mistake: Manually typing "Amount" instead of picking the dynamic variable</text>

    <!-- Left Box: WRONG -->
    <g transform="translate(36, 96)">
      <rect width="396" height="300" rx="14" fill="#fff5f5" stroke="#e57373" stroke-width="2"/>
      
      <!-- Badge -->
      <rect x="18" y="18" width="170" height="32" rx="8" fill="#d32f2f"/>
      <text x="32" y="40" font-size="15" font-weight="700" fill="#ffffff">❌ WRONG · Typed Text</text>

      <!-- Mockup Input Field -->
      <text x="24" y="85" font-size="13" font-weight="600" fill="#5a524a">Typing on keyboard into Amount field:</text>
      <rect x="24" y="96" width="348" height="48" rx="8" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.5"/>
      <text x="38" y="126" font-size="15" fill="#8c877e">amount</text>
      <text x="120" y="126" font-size="15" fill="#1d1c19" font-family="Courier, monospace">Amount</text>

      <g transform="translate(24, 160)">
        <circle cx="12" cy="12" r="10" fill="#d32f2f"/>
        <text x="8" y="17" font-size="14" font-weight="bold" fill="#fff">!</text>
        <text x="32" y="17" font-size="14" font-weight="700" fill="#c62828">Why does this fail?</text>
        <text x="32" y="40" font-size="13" fill="#5c2020" line-height="1.5">
          Typing <tspan font-family="monospace" font-weight="bold">Amount</tspan> sends the plain English letters.
        </text>
        <text x="32" y="62" font-size="13" fill="#5c2020">
          The server only sees the word "Amount" with zero digits,
        </text>
        <text x="32" y="84" font-size="13" fill="#5c2020">
          resulting in missing amounts or RM 0.00 entries!
        </text>
      </g>
    </g>

    <!-- Right Box: RIGHT -->
    <g transform="translate(468, 96)">
      <rect width="396" height="300" rx="14" fill="#f0fbf4" stroke="#48bb78" stroke-width="2"/>
      
      <!-- Badge -->
      <rect x="18" y="18" width="180" height="32" rx="8" fill="#2e7d32"/>
      <text x="32" y="40" font-size="15" font-weight="700" fill="#ffffff">✅ RIGHT · Variable Pill</text>

      <!-- Mockup Input Field with Pill -->
      <text x="24" y="85" font-size="13" font-weight="600" fill="#5a524a">Tap field → Select Variable → Choose Amount:</text>
      <rect x="24" y="96" width="348" height="48" rx="8" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5"/>
      <text x="38" y="126" font-size="15" fill="#8c877e">amount</text>
      
      <!-- Blue Variable Pill -->
      <g transform="translate(112, 104)">
        <rect width="220" height="32" rx="16" fill="#e0f2fe" stroke="#38bdf8"/>
        <circle cx="16" cy="16" r="6" fill="#0284c7"/>
        <text x="30" y="21" font-size="14" font-weight="700" fill="#0369a1">Transaction ➔ Amount</text>
      </g>

      <g transform="translate(24, 160)">
        <circle cx="12" cy="12" r="10" fill="#2e7d32"/>
        <text x="8" y="17" font-size="14" font-weight="bold" fill="#fff">✓</text>
        <text x="32" y="17" font-size="14" font-weight="700" fill="#1b5e20">How it works:</text>
        <text x="32" y="40" font-size="13" fill="#1e4620">
          When you see the <tspan fill="#0284c7" font-weight="bold">blue pill</tspan>, you are good!
        </text>
        <text x="32" y="62" font-size="13" fill="#1e4620">
          On every Apple Pay tap, iOS dynamically extracts
        </text>
        <text x="32" y="84" font-size="13" fill="#1e4620">
          the real charge (e.g. RM 12.50) and sends it to Tally.
        </text>
      </g>
    </g>

    <!-- Bottom Tip Card -->
    <g transform="translate(36, 412)">
      <rect width="828" height="56" rx="10" fill="#ffffff" stroke="#d5cfc5" stroke-width="1"/>
      <text x="24" y="34" font-size="15" font-weight="700" fill="#f59e0b">💡 Golden Rule:</text>
      <text x="130" y="34" font-size="14" fill="#1d1c19">
        Field keys (<tspan font-family="monospace">type, amount, merchant</tspan>) are typed text; but <tspan font-weight="700" fill="#0369a1">values must be blue variable pills!</tspan>
      </text>
    </g>
  </g>
</svg>
