<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f0e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally Cloud">
<meta name="format-detection" content="telephone=no">
<title>Tally Cloud</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/newsreader-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/boot.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand"><img src="/icon.svg" alt="" width="26" height="26">Tally</h1>
    <div class="sync" id="sync" role="status" aria-live="polite"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#home" data-tab="home"></a>
    <a href="#list" data-tab="list"></a>
    <button class="fab" id="fab" type="button" aria-label="Add expense"></button>
    <a href="#stats" data-tab="stats"></a>
    <a href="#settings" data-tab="settings"></a>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="recover-file" accept=".jsonl,.ndjson,.txt,application/json" hidden>
</body>
</html>
