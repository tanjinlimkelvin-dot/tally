<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Wrong typed words versus real variables</title><desc id="d">Authored diagram, not an OS screenshot. Insert Transaction Amount using the variable picker instead of typing Amount.</desc><rect width="900" height="440" fill="#f2f0e9"/><g font-family="Arial,sans-serif" fill="#202423"><text x="30" y="42" font-size="25" font-weight="bold">Values that change must be variable pills</text><text x="30" y="72" font-size="16">AUTHORED DIAGRAM · NOT AN OS SCREENSHOT</text><rect x="30" y="104" width="400" height="206" rx="16" fill="white" stroke="#b34343" stroke-width="3"/><rect x="470" y="104" width="400" height="206" rx="16" fill="white" stroke="#267251" stroke-width="3"/><text x="52" y="142" font-size="22" fill="#a82f2f">WRONG · pasted label</text><text x="492" y="142" font-size="22" fill="#267251">RIGHT · inserted variable</text><text x="52" y="196" font-size="19">amount</text><text x="205" y="196" font-size="19">Amount</text><text x="492" y="196" font-size="19">amount</text><rect x="602" y="168" width="245" height="43" rx="18" fill="#deedff"/><text x="615" y="195" font-size="18" fill="#175da8" font-weight="bold">Transaction → Amount</text><text x="52" y="251" font-size="17">Sends the word “Amount”.</text><text x="492" y="251" font-size="17">Reads this transaction's amount.</text><text x="30" y="351" font-size="19">Tap value → Select Variable → Transaction → choose Amount</text><text x="30" y="385" font-size="17">Also insert UUID, formatted date, Title, Body, and message input as variables.</text><text x="30" y="414" font-size="16">Type keys and fixed source names. Never paste variable labels as live values.</text></g></svg>