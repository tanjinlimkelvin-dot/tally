<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="t d"><title id="t">POST JSON setup schema</title><desc id="d">Authored diagram, not an OS screenshot. POST to your origin's ingest endpoint with bearer authorization and JSON content type. Blue pills represent action outputs.</desc><rect width="900" height="610" fill="#f2f0e9"/><g font-family="Arial,sans-serif" fill="#202423"><text x="30" y="42" font-size="26" font-weight="bold">Get Contents of URL · POST</text><text x="30" y="73" font-size="16">AUTHORED DIAGRAM · NOT AN OS SCREENSHOT · NO REAL TOKEN</text><rect x="25" y="95" width="850" height="425" rx="18" fill="white"/><g font-size="19"><text x="45" y="132">URL: https://YOUR-APP.example/api/ingest?format=text</text><text x="45" y="175">Authorization</text><text x="270" y="175">Bearer &lt;your private upload-only token&gt;</text><text x="45" y="216">Content-Type</text><text x="270" y="216">application/json</text><text x="45" y="263" font-weight="bold">Request Body: JSON · add fields, not a pasted text template</text><text x="45" y="308">event_id</text><text x="45" y="353">at</text><text x="45" y="398">type</text><text x="270" y="398">sms</text><text x="45" y="443">text</text></g><g fill="#deedff"><rect x="265" y="280" width="220" height="40" rx="16"/><rect x="265" y="326" width="290" height="40" rx="16"/><rect x="265" y="416" width="370" height="40" rx="16"/></g><g fill="#175da8" font-size="19" font-weight="bold"><text x="280" y="307">Generate UUID output</text><text x="280" y="353">Format Date → ISO 8601</text><text x="280" y="443">Shortcut Input → message body</text></g><text x="45" y="491" font-size="17">Wallet: type = applepay · Notification: type = notification</text><text x="30" y="554" font-size="19">Then: Show Notification → Contents of URL (Text)</text><text x="30" y="588" font-size="17">A failed POST is not an automatic retry. Preserve the original event ID for recovery.</text></g></svg>